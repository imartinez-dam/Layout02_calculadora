# Configuració de Gradle per a tot el projecte
# Si configurem aquestes opcions des d’Android Studio, tenen prioritat sobre les d’aquí
# Més informació sobre la configuració de Gradle
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Opcions de la JVM de Gradle, aquí li donem fins a 2 GB de memòria i fem servir UTF-8
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Si descomentem aquesta opció, Gradle pot executar tasques de diferents mòduls en paral·lel
# Té sentit quan els mòduls poden treballar de manera independent, més informació aquí
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Guardem la configuració a la memòria cau per reutilitzar-la quan no ha canviat res que l’afecti
org.gradle.configuration-cache=true
# Fem servir l’estil oficial de Kotlin
kotlin.code.style=official